services:
  uceap_logging.request_logger_subscriber:
    class: Drupal\uceap_logging\EventSubscriber\RequestLoggerSubscriber
    arguments: ['@logger.factory', '@current_user']
    tags:
      - { name: event_subscriber }

  uceap_logging.session_processor:
    class: Drupal\uceap_logging\Logger\SessionProcessor
    arguments: ['@request_stack']
    tags:
      - { name: monolog.processor }

  uceap_logging.queue_factory:
    class: Drupal\uceap_logging\Queue\QueueFactoryDecorator
    decorates: queue
    decoration_priority: -100
    calls:
      - [setDecoratedFactory, ['@uceap_logging.queue_factory.inner']]
      - [setLoggerFactory, ['@logger.factory']]
